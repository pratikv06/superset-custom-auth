# ---------------------------------------------------------------------------
# Superset + Custom FastAPI Auth Service
# ---------------------------------------------------------------------------

x-superset-env: &superset-env
  DATABASE_URL: postgresql+psycopg2://superset:superset@db:5432/superset
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-superset-secret}
  AUTH_SERVICE_URL: http://auth-service:8000
  PYTHONPATH: /app/pythonpath
  SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py

services:

  # --------------------------------------------------------------------------
  # PostgreSQL — Superset metadata store
  # --------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: superset-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # FastAPI Auth Service  (SQLite)
  # --------------------------------------------------------------------------
  auth-service:
    container_name: auth
    build:
      context: ./auth_service
    restart: unless-stopped
    environment:
      SECRET_KEY: ${AUTH_SECRET_KEY:-change-me-auth-secret}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      DB_PATH: /app/data/auth.db
    volumes:
      - auth_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # Superset Init — runs migrations + bootstraps admin, then exits
  # --------------------------------------------------------------------------
  superset-init:
    container_name: superset-init
    build:
      context: ./superset
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      <<: *superset-env
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@superset.local}
      ADMIN_FIRST: ${ADMIN_FIRST:-Admin}
      ADMIN_LAST: ${ADMIN_LAST:-User}
    volumes:
      - superset_home:/app/superset_home
      - ./scripts/init.sh:/app/init.sh:ro
    command: ["bash", "/app/init.sh"]

  # --------------------------------------------------------------------------
  # Superset Web
  # --------------------------------------------------------------------------
  superset:
    container_name: superset-web
    build:
      context: ./superset
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    environment:
      <<: *superset-env
    volumes:
      - superset_home:/app/superset_home
    ports:
      - "8088:8088"
    command:
      - gunicorn
      - --bind=0.0.0.0:8088
      - --workers=2
      - --worker-class=gthread
      - --threads=20
      - --timeout=120
      - --limit-request-line=0
      - --limit-request-field_size=0
      - "superset.app:create_app()"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  auth_data:
  superset_home:
